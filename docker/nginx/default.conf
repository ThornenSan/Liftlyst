server {
    listen 80;
    server_name _;

    # Laravel's public/ is the ONLY web-reachable directory. Pointing root at
    # the project root instead would expose .env, storage/ and vendor/ to
    # anyone who guesses a URL.
    root /var/www/html/public;
    index index.php;

    charset utf-8;

    # Log to the container's stdout/stderr so `docker compose logs nginx` shows
    # them, instead of burying them in a file inside the container.
    access_log /dev/stdout;
    error_log  /dev/stderr;

    client_max_body_size 20M;

    # Front controller. Serve the file if it exists on disk (CSS, images —
    # nginx handles these directly, no PHP involved), otherwise hand the URL to
    # Laravel's index.php. This fallback is what makes /api/v1/health work.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Browsers request these constantly; don't fill the log with 404s.
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        # "app" is the docker-compose service name — Docker's embedded DNS
        # resolves it to the php-fpm container. NOT localhost: inside this
        # container, localhost is nginx itself and nothing listens on 9000.
        fastcgi_pass app:9000;
        fastcgi_index index.php;

        include fastcgi_params;

        # FastCGI sends a PATH, not file contents. php-fpm opens this path in
        # its own filesystem, so both containers must mount the code at the
        # same location. Omitting this line is what produces the classic
        # "Primary script unknown" error.
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT   $realpath_root;
    }

    # Block /.env, /.git/config and friends, while still allowing
    # /.well-known/ for ACME challenges and app-association files.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
