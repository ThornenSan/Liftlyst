; Overrides for Liftlyst. PHP reads conf.d alphabetically and the last value
; wins, so the "zz-" prefix guarantees these beat the docker-php-ext-*.ini
; files the image generates.

; PHPStan/Larastan at level max holds the whole type graph in memory and
; blows past PHP's 128M default.
memory_limit = 512M

; PHP's defaults here are small enough to truncate uploads silently.
; post_max_size must be >= upload_max_filesize or the latter is meaningless.
upload_max_filesize = 20M
post_max_size = 20M

max_execution_time = 60
